---
- name: Create exporters
  hosts: docker0.nibbler
  tasks:
    - name: Install pihole-exporter for dns0
      become: true
      community.docker.docker_container:
        name: pihole-exporter0
        image: ekofr/pihole-exporter:v0.4.0
        image_name_mismatch: recreate
        log_driver: "{{ docker_log_driver }}"
        log_options: "{{ docker_log_options }}"
        networks:
          - name: "{{ 'vlan-' + vlan_management.name }}"
            ipv4_address: "{{ ip_dns_exporter_0 }}"
        dns_servers:
          - "{{ vlan_management.ip }}.1"
        published_ports:
          - 9617/tcp
        restart_policy: unless-stopped
        state: started
        env:
          PIHOLE_HOSTNAME: "{{ ip_dns_0 }}"
          PIHOLE_PASSWORD: "{{ pihole_admin_password }}"
          PORT: "9617"
    - name: Install pihole-exporter for dns1
      become: true
      community.docker.docker_container:
        name: pihole-exporter1
        image: ekofr/pihole-exporter:v0.4.0
        image_name_mismatch: recreate
        log_driver: "{{ docker_log_driver }}"
        log_options: "{{ docker_log_options }}"
        networks:
          - name: "{{ 'vlan-' + vlan_management.name }}"
            ipv4_address: "{{ ip_dns_exporter_1 }}"
        dns_servers:
          - "{{ vlan_management.ip }}.1"
        published_ports:
          - 9617/tcp
        restart_policy: unless-stopped
        state: started
        env:
          PIHOLE_HOSTNAME: "{{ ip_dns_1 }}"
          PIHOLE_PASSWORD: "{{ pihole_admin_password }}"
          PORT: "9617"
    - name: Remove speedtest-exporter
      become: true
      community.docker.docker_container:
        name: speed-test
        state: absent
    - name: Install ntp-exporter
      become: true
      community.docker.docker_container:
        name: ntp-exporter
        image: quay.io/superq/chrony-exporter:v0.10.1
        image_name_mismatch: recreate
        log_driver: "{{ docker_log_driver }}"
        log_options: "{{ docker_log_options }}"
        command: --chrony.address="{{ ip_ntp }}:323" --collector.tracking --no-collector.sources
        networks:
          - name: services
        comparisons:
          networks: strict
        restart_policy: unless-stopped
        state: started
    - name: Install pve-exporter
      become: true
      community.docker.docker_container:
        name: pve-exporter
        image: prompve/prometheus-pve-exporter:3.4.3
        image_name_mismatch: recreate
        log_driver: "{{ docker_log_driver }}"
        log_options: "{{ docker_log_options }}"
        networks:
          - name: services
        comparisons:
          networks: strict
        # NOTE: Template the complete mapping because Docker does not render
        # Jinja expressions used directly as etc_hosts dictionary keys.
        etc_hosts: |-
          {{ {('nibbler.' + domain_lan): hostvars['nibbler'].ip_management} }}
        restart_policy: unless-stopped
        state: started
        env:
          PVE_USER: root@pam
          PVE_TOKEN_NAME: exporter-token
          PVE_TOKEN_VALUE: "{{ pve_token }}"
- name: Create node exporters
  hosts: nodes
  roles:
    - role: node_exporter
      become: true
      node_exporter_ip: "{{ ip_management }}"
      node_exporter_baremetal: "{{ is_baremetal }}"
- name: Create docker exporters
  hosts: docker
  tasks:
    - name: Install cadvisor
      become: true
      community.docker.docker_container:
        name: cadvisor
        image: gcr.io/cadvisor/cadvisor:v0.49.1
        image_name_mismatch: recreate
        log_driver: "{{ docker_log_driver }}"
        log_options: "{{ docker_log_options }}"
        networks:
          - name: services
        comparisons:
          networks: strict
        published_ports:
          - "{{ ip_management }}:8080:8080/tcp"
        restart_policy: unless-stopped
        state: started
        volumes:
          - "/:/rootfs:ro"
          - "/var/run:/var/run:ro"
          - "/sys:/sys:ro"
          - "/var/lib/docker/:/var/lib/docker:ro"
          - "/dev/disk/:/dev/disk:ro"
- name: Setup prometheus
  hosts: docker0.nibbler
  roles:
    - role: prometheus
      become: true
      prometheus_network: services
      prometheus_alertmanager_network: services
      prometheus_alertmanager_discord: "{{ alertmanager_discord }}"
      prometheus_grafana_network: services
      prometheus_grafana_org: "{{ domain }}"
      prometheus_grafana_user: "{{ admin }}"
      prometheus_grafana_password: "{{ grafana_admin_password }}"
      prometheus_jobs:
        - name: dns
          static_configs:
            - targets: ["{{ ip_dns_exporter_0 }}:9617"]
              labels:
                host: "dns0"
            - targets: ["{{ ip_dns_exporter_1 }}:9617"]
              labels:
                host: "dns1"
        - name: time
          static_configs:
            - targets: ["ntp-exporter:9123"]
        - name: nginx
          static_configs:
            - targets: ["nginx-exporter:4040"]
        - name: proxmox
          static_configs:
            # NOTE: The exporter resolves this name through its managed
            # /etc/hosts entry so that the TLS certificate name is preserved.
            - targets: ["nibbler.{{ domain_lan }}"]
          metrics_path: /pve
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: "pve-exporter:9221"
        - name: nummus
          static_configs:
            - targets: ["nummus:8001"]
