---
# Section files are loaded before validation. Keep these bindings as role
# defaults so inventory and host variables retain their normal precedence.
netgear_wax620_host: "{{ netgear_wax620_connection_defaults.host }}"
netgear_wax620_admin_username: "{{ netgear_wax620_connection_defaults.admin_username }}"
netgear_wax620_admin_password: "{{ netgear_wax620_connection_defaults.admin_password }}"
netgear_wax620_validate_certs: "{{ netgear_wax620_connection_defaults.validate_certs }}"
netgear_wax620_timeout_s: "{{ netgear_wax620_connection_defaults.timeout_s }}"
netgear_wax620_name: "{{ netgear_wax620_basic_settings_defaults.name }}"
netgear_wax620_country_region: "{{ netgear_wax620_basic_settings_defaults.country_region }}"
netgear_wax620_timezone: "{{ netgear_wax620_time_settings_defaults.timezone }}"
netgear_wax620_ntp_server: "{{ netgear_wax620_time_settings_defaults.ntp_server }}"
netgear_wax620_lan_settings: "{{ netgear_wax620_lan_settings_defaults.settings }}"
netgear_wax620_lan_update_timeout_s: "{{ netgear_wax620_lan_settings_defaults.update_timeout_s }}"
netgear_wax620_access_control_groups: "{{ netgear_wax620_access_control_defaults.groups }}"
