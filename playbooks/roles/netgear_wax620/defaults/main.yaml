netgear_wax620_ssids: "{{ netgear_wax620_ssid_settings_defaults.ssids }}"
netgear_wax620_time_zone_ids: "{{ netgear_wax620_enum_defaults.time_zone_ids }}"
netgear_wax620_radio_mode_ids: "{{ netgear_wax620_enum_defaults.radio_mode_ids }}"
netgear_wax620_radio_tx_power_ids: "{{ netgear_wax620_enum_defaults.radio_tx_power_ids }}"
netgear_wax620_radio_width_ids: "{{ netgear_wax620_enum_defaults.radio_width_ids }}"
