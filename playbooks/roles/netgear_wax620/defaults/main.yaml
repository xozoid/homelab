---
# The WAX620 JSON API has no public contract. Keep appliance-specific values
# here so host variables describe intent rather than protocol enums.
netgear_wax620_host: "{{ ip_management }}"
netgear_wax620_admin_username: admin
netgear_wax620_admin_password: ""
netgear_wax620_name: "{{ inventory_hostname }}"
netgear_wax620_country_region: "840"
netgear_wax620_timezone: USA-Pacific
netgear_wax620_time_zone_ids:
  USA-Pacific: "265"
netgear_wax620_ntp_server: "ntp.{{ domain_lan }}"
netgear_wax620_lan_settings:
  dhcp_client: false
  ip_address: "{{ ip_management }}"
  netmask: 255.255.255.0
  gateway: "{{ vlan_management.ip }}.1"
  primary_dns: "{{ ip_dns_0 }}"
  secondary_dns: "{{ ip_dns_1 }}"
  network_integrity_check: false
  untagged_vlan: 1
  management_vlan: "{{ vlan_management.id }}"
  inter_vlan_routing: true
netgear_wax620_access_control_groups: []
netgear_wax620_validate_certs: false
netgear_wax620_timeout_s: 10
# The LAN save captured in lan.har took nearly 23 seconds.
netgear_wax620_lan_update_timeout_s: 60
netgear_wax620_access_control_update_timeout_s: 60
