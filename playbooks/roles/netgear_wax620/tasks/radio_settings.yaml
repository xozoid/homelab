---
- name: Read WAX620 radio settings
  ansible.builtin.uri:
    url: "https://{{ netgear_wax620_host }}/socketCommunication"
    method: POST
    body_format: json
    body:
      system:
        wlanSettings:
          wlanSettingTable:
            getRadioDetails: ""
    headers: "{{ netgear_wax620_session_headers }}"
    return_content: true
    status_code: 200
    timeout: "{{ netgear_wax620_timeout_s }}"
    validate_certs: "{{ netgear_wax620_validate_certs }}"
  register: netgear_wax620_radio_settings_response
  no_log: true
  changed_when: false
  failed_when: >-
    (netgear_wax620_radio_settings_response.content | from_json).status | default(-1) | int != 0
- name: Extract current WAX620 radio settings
  ansible.builtin.set_fact:
    # NOTE: The radio getter omits beamForming, so the role cannot manage it idempotently.
    netgear_wax620_radio_settings_current:
      wlan0:
        radioStatus: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan0.radioStatus }}"
        operateMode: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan0.operateMode }}"
        guardInterval: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan0.guardInterval }}"
        txPower: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan0.txPower }}"
        channel: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan0.channel }}"
        channelWidth: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan0.channelWidth }}"
      wlan1:
        radioStatus: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan1.radioStatus }}"
        operateMode: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan1.operateMode }}"
        guardInterval: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan1.guardInterval }}"
        txPower: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan1.txPower }}"
        channel: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan1.channel }}"
        channelWidth: "{{ (netgear_wax620_radio_settings_response.content | from_json).system.wlanSettings.wlanSettingTable.wlan1.channelWidth }}"
- name: Set desired WAX620 radio settings
  ansible.builtin.set_fact:
    netgear_wax620_radio_settings_desired:
      wlan0:
        radioStatus: "{{ netgear_wax620_radio_settings.wlan0.enabled | ternary('1', '0') }}"
        operateMode: "{{ netgear_wax620_radio_mode_ids.wlan0[netgear_wax620_radio_settings.wlan0.mode] }}"
        guardInterval: "{{ netgear_wax620_radio_guard_interval_ids[netgear_wax620_radio_settings.wlan0.guard_interval] }}"
        txPower: "{{ netgear_wax620_radio_tx_power_ids[netgear_wax620_radio_settings.wlan0.tx_power_percent] }}"
        channel: "{{ netgear_wax620_radio_settings.wlan0.channel }}"
        channelWidth: "{{ netgear_wax620_radio_width_ids[netgear_wax620_radio_settings.wlan0.channel_width_mhz] }}"
      wlan1:
        radioStatus: "{{ netgear_wax620_radio_settings.wlan1.enabled | ternary('1', '0') }}"
        operateMode: "{{ netgear_wax620_radio_mode_ids.wlan1[netgear_wax620_radio_settings.wlan1.mode] }}"
        guardInterval: "{{ netgear_wax620_radio_guard_interval_ids[netgear_wax620_radio_settings.wlan1.guard_interval] }}"
        txPower: "{{ netgear_wax620_radio_tx_power_ids[netgear_wax620_radio_settings.wlan1.tx_power_percent] }}"
        channel: "{{ netgear_wax620_radio_settings.wlan1.channel }}"
        channelWidth: "{{ netgear_wax620_radio_width_ids[netgear_wax620_radio_settings.wlan1.channel_width_mhz] }}"
- name: Update WAX620 radio settings
  ansible.builtin.uri:
    url: "https://{{ netgear_wax620_host }}/socketCommunication"
    method: POST
    body_format: json
    body:
      system:
        wlanSettings:
          wlanSettingTable: "{{ netgear_wax620_radio_settings_desired }}"
    headers: "{{ netgear_wax620_session_headers }}"
    return_content: true
    status_code: 200
    timeout: "{{ netgear_wax620_radio_update_timeout_s }}"
    validate_certs: "{{ netgear_wax620_validate_certs }}"
  register: netgear_wax620_radio_settings_update
  no_log: true
  when: netgear_wax620_radio_settings_current != netgear_wax620_radio_settings_desired
  changed_when: true
  failed_when: >-
    (netgear_wax620_radio_settings_update.content | from_json).status | default(-1) | int != 0
