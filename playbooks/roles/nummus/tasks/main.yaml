---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nummus_owner }}"
    group: "{{ nummus_group }}"
    mode: "0755"
  with_items:
    - /etc/nummus
    - /etc/nummus/portfolio.importers
- name: Clone nummus-importers locally
  delegate_to: localhost
  ansible.builtin.git:
    repo: "git@github.com:xozoid/nummus-importers.git"
    dest: "/home/{{ admin }}/Code/nummus-importers"
    version: main
    key_file: /home/zoidberg/.ssh/id_ed25519_xoz
  notify:
    - Restart nummus
- name: Copy nummus-importers
  ansible.builtin.copy:
    src: "/home/{{ admin }}/Code/nummus-importers/importers/"
    dest: /etc/nummus/portfolio.importers/
    owner: "{{ nummus_owner }}"
    group: "{{ nummus_group }}"
    mode: "0755"
  notify:
    - Restart nummus
- name: Install nummus
  community.docker.docker_container:
    name: nummus
    image: wattsup314/nummus-financial:latest
    image_name_mismatch: recreate
    log_driver: "{{ docker_log_driver }}"
    log_options: "{{ docker_log_options }}"
    pull: always
    networks:
      - name: "{{ nummus_network }}"
    comparisons:
      networks: strict
    restart_policy: unless-stopped
    state: started
    volumes:
      - /etc/nummus:/data
