---
- name: Make directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/pihole
    - /etc/pihole/pihole
    - /etc/pihole/dnsmasq.d
- name: Create dnsmasq configuration
  ansible.builtin.template:
    src: etc-dnsmasq-conf.jinja
    dest: /etc/pihole/dnsmasq.d/10-ansible.conf
    mode: "0644"
  notify:
    - Reload DNS rules
- name: Install pihole
  become: true
  community.docker.docker_container:
    name: pihole
    image: "{{ pihole_image }}"
    image_name_mismatch: recreate
    log_driver: "{{ docker_log_driver }}"
    log_options: "{{ docker_log_options }}"
    hostname: "{{ pihole_hostname }}"
    networks:
      - name: "{{ pihole_network }}"
        ipv4_address: "{{ pihole_ip }}"
    dns_servers:
      - 127.0.0.1
    published_ports:
      - 443/tcp
      - 53/tcp
      - 53/udp
      - 80/tcp
    restart_policy: unless-stopped
    state: started
    volumes:
      - "/etc/pihole/pihole:/etc/pihole:rw"
      - "/etc/pihole/dnsmasq.d:/etc/dnsmasq.d:rw"
    env:
      TZ: "{{ timezone }}"
      FTLCONF_webserver_api_password: "{{ pihole_password }}"
      # Conditional forwarding for DHCP hostname resolution
      FTLCONF_dns_revServers: "true,{{ pihole_dhcp_subnet }},{{ pihole_dhcp_server }},"
      FTLCONF_dns_domainNeeded: "true"
      FTLCONF_dns_upstreams: "{{ pihole_upstreams | join('\n') }}"
      FTLCONF_dns_dnssec: "{{ pihole_dnssec | string | lower }}"
      FTLCONF_dns_listeningMode: SINGLE
      # Pi-hole v6 ignores custom dnsmasq files unless this is explicitly set.
      FTLCONF_misc_etc_dnsmasq_d: "true"
