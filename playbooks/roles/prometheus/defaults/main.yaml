---
# Default variables for prometheus

# Scraping jobs
prometheus_jobs: []
# - name: job name
#   scrape_interval: 15s (default)
#   metrics_path: /metrics (default)
#   static_configs:
#     - targets: [ "192.168.1.2:8000" ]

prometheus_network: services
prometheus_management_network: ""
prometheus_management_ip: ""
prometheus_grafana_network: services
prometheus_alertmanager_network: services
prometheus_alertmanager_discord:
prometheus_grafana_user: admin
prometheus_grafana_password: admin
prometheus_grafana_org: Main Org.
prometheus_version: 2.53.1
